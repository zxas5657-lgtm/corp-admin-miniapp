<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="公司行政小程序的可点击界面原型：日程、会议、用车。" />
    <title>日程 · 行政助手</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="stage">
      <p class="stage-caption">行政助手 · 浏览器里的界面原型，不需要微信开发者工具</p>
      <div class="phone" id="phone">
        <div class="status">
          <span>09:20</span>
          <span class="status-icons">
            <svg width="17" height="12" viewBox="0 0 17 12" aria-hidden="true">
              <rect x="0" y="7" width="3" height="5" rx="0.5"></rect>
              <rect x="4.5" y="5" width="3" height="7" rx="0.5"></rect>
              <rect x="9" y="2.5" width="3" height="9.5" rx="0.5"></rect>
              <rect x="13.5" y="0" width="3" height="12" rx="0.5"></rect>
            </svg>
            <svg width="15" height="12" viewBox="0 0 15 12" aria-hidden="true">
              <path d="M1.2 5.2a8 8 0 0 1 12.6 0" fill="none" stroke="#1c2430" stroke-width="1.3" stroke-linecap="round"></path>
              <path d="M3.6 7.6a4.6 4.6 0 0 1 7.8 0" fill="none" stroke="#1c2430" stroke-width="1.3" stroke-linecap="round"></path>
              <circle cx="7.5" cy="10.2" r="1" fill="#1c2430"></circle>
            </svg>
            <svg width="25" height="12" viewBox="0 0 25 12" aria-hidden="true">
              <rect x="0.6" y="0.6" width="21" height="10.8" rx="2" fill="none" stroke="#1c2430" stroke-width="1"></rect>
              <rect x="2" y="2" width="16" height="8" rx="1"></rect>
              <rect x="22.6" y="3.8" width="1.6" height="4.4" rx="0.5"></rect>
            </svg>
          </span>
        </div>
        <header class="nav">
          <button type="button" class="nav-back" id="nav-back" hidden aria-label="返回">
            <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true">
              <path d="M13.5 5.5 8 11l5.5 5.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
          </button>
          <h1 class="nav-title" id="nav-title">日程</h1>
          <div class="capsule" aria-hidden="true">
            <svg width="18" height="6" viewBox="0 0 18 6">
              <circle cx="3" cy="3" r="1.25"></circle>
              <circle cx="9" cy="3" r="1.25"></circle>
              <circle cx="15" cy="3" r="1.25"></circle>
            </svg>
            <i class="capsule-split"></i>
            <svg width="16" height="16" viewBox="0 0 16 16">
              <circle cx="8" cy="8" r="5.2" fill="none" stroke="#1c2430" stroke-width="1.4"></circle>
              <circle cx="8" cy="8" r="1.5"></circle>
            </svg>
          </div>
          <div class="nav-progress" id="nav-progress" hidden></div>
        </header>
        <main id="screen" class="screen"></main>
        <nav class="tabs" id="tabs" aria-label="底部导航">
          <a href="#/schedule" data-tab="schedule">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="4" y="5" width="16" height="15" rx="2"></rect>
              <path d="M8 3.5v3M16 3.5v3M4 9.5h16"></path>
            </svg>
            <span>日程</span>
          </a>
          <a href="#/meetings" data-tab="meetings">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="5" y="3.5" width="14" height="17" rx="2"></rect>
              <path d="M8.5 8.5h7M8.5 12h7M8.5 15.5h4.5"></path>
            </svg>
            <span>会议</span>
          </a>
          <a href="#/vehicles" data-tab="vehicles">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 15h16M6.2 15 8 10.5h8L17.8 15"></path>
              <circle cx="8" cy="16.6" r="1.4"></circle>
              <circle cx="16" cy="16.6" r="1.4"></circle>
            </svg>
            <span class="badge" id="pending-badge" hidden>0</span>
            <span>用车</span>
          </a>
          <a href="#/me" data-tab="me">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="9" r="3"></circle>
              <path d="M6.2 19.2c.9-2.6 2.8-3.9 5.8-3.9s4.9 1.3 5.8 3.9"></path>
            </svg>
            <span>我的</span>
          </a>
        </nav>
        <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
        <div class="sheet-root" id="sheet-root" hidden>
          <button type="button" class="sheet-mask" data-action="close-sheet" aria-label="关闭弹层"></button>
          <div class="sheet" id="sheet" role="dialog" aria-modal="true" tabindex="-1"></div>
        </div>
      </div>
    </div>
    <noscript>
      <p class="stage-caption">需要启用 JavaScript 才能点选这个原型。</p>
    </noscript>
    <script src="app.js"></script>
  </body>
</html>
